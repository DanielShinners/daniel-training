<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101611">
<title>Scoreboard · Yappers Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --ink:#101611; --ink2:#181F19; --line:#2c352d; --cream:#FFF0D7; --muted:#b9b09f; --red:#CD2A2D; --mud:#0E5A2C; --mud2:#8A2412; --pis:#E2600F; --pis2:#1C3B83; --display:Anton,Impact,sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--cream); font: 15px/1.45 Archivo, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 980px; margin: 0 auto; padding: 18px 16px calc(28px + env(safe-area-inset-bottom)); }
.d { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: .02em; }
/* passcode gate */
.gate { min-height: 90vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }
.gate img.wm { width: min(78vw, 360px); height: auto; }
.gate form { display: flex; flex-direction: column; gap: 12px; width: min(86vw, 320px); }
.gate input { background: var(--ink2); border: 1.5px solid var(--line); border-radius: 8px; padding: 14px; font-size: 22px; text-align: center; letter-spacing: .3em; text-transform: uppercase; }
.gate input:focus { outline: none; border-color: var(--cream); }
.err { color: #ff7b7b; font-weight: 600; min-height: 1.4em; margin: 0; }
.btn { border: 0; border-radius: 8px; padding: 14px 18px; font-family: var(--display); font-size: 18px; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; background: var(--red); color: var(--cream); touch-action: manipulation; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 2px rgba(255,240,215,.5); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; }
/* board */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.top img { height: 30px; width: auto; }
.top .live { font-size: 12px; font-weight: 800; letter-spacing: .18em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.top .live i { width: 8px; height: 8px; border-radius: 50%; background: #3fbf6b; display: inline-block; }
.top .live.off i { background: #f0b54a; }
.clock { text-align: center; margin: 18px 0 8px; }
.clock .half { font-size: 18px; color: var(--muted); letter-spacing: .12em; }
.clock .time { font-size: clamp(64px, 18vw, 150px); line-height: .95; font-variant-numeric: tabular-nums; }
.clock .time.over { color: var(--red); }
.clock .note { font-size: 13px; font-weight: 800; letter-spacing: .16em; color: var(--red); min-height: 1.3em; }
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
.team { border-radius: 16px; padding: 16px 12px 14px; text-align: center; position: relative; }
.team.mudguts { background: var(--mud); box-shadow: inset 0 0 0 3px var(--mud2); }
.team.pissants { background: var(--pis); box-shadow: inset 0 0 0 3px var(--pis2); }
.team img { width: clamp(64px, 16vw, 120px); height: auto; display: block; margin: 0 auto 6px; }
.team .name { font-size: clamp(20px, 5vw, 34px); line-height: 1; }
.team .total { font-size: clamp(76px, 20vw, 170px); line-height: .9; margin-top: 8px; font-variant-numeric: tabular-nums; }
.team .gb { font-size: clamp(22px, 5.5vw, 40px); opacity: .9; font-variant-numeric: tabular-nums; }
.team .lead { position: absolute; top: 10px; right: 12px; font-size: 11px; font-weight: 800; letter-spacing: .14em; background: var(--cream); color: var(--ink); border-radius: 999px; padding: 3px 8px; }
.team .add { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.team .add .btn { background: var(--cream); color: var(--ink); padding: 16px 6px; font-size: clamp(16px, 4.2vw, 22px); }
.margin { text-align: center; margin: 14px 0 0; font-size: clamp(18px, 4.5vw, 26px); }
.controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 22px; }
.controls .btn { font-size: 16px; }
.controls .wide { grid-column: 1 / -1; }
.log { margin-top: 24px; }
.log h2 { font-size: 18px; margin: 0 0 6px; color: var(--muted); letter-spacing: .1em; }
.log div { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; display: flex; justify-content: space-between; gap: 10px; }
.log span { color: var(--muted); }
body.display .controls, body.display .team .add, body.display .log, body.display .hint { display: none; }
body.display .exit { display: inline-block; }
.exit { display: none; }
.hint { color: var(--muted); font-size: 12px; text-align: center; margin: 18px 0 0; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 20px; }
.sheet { width: 100%; max-width: 420px; background: var(--cream); color: var(--ink); border-radius: 16px; padding: 22px 20px; }
.sheet h3 { margin: 0 0 8px; font-size: 26px; }
.sheet p { margin: 0 0 16px; }
.sheet .row { display: flex; gap: 10px; }
.sheet .btn.ghost { box-shadow: inset 0 0 0 2px var(--ink); color: var(--ink); }
@media (min-width: 760px) and (orientation: landscape) {
  .teams { gap: 20px; }
  .controls { grid-template-columns: repeat(4, 1fr); }
  .controls .wide { grid-column: auto; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(() => {
  const SUPA = 'https://dsbfhvmcxafqeawwgcrf.supabase.co', ANON = 'sb_publishable_dy0wvwCT1tU3OlyepK5I0w_jknlpVB2';
  const A = 'https://cdn.jsdelivr.net/gh/DanielShinners/daniel-training@dbd719bde1625f314db194e926a33435461774d1/yappers-cup/assets/';
  const HALF_MS = 20 * 60 * 1000;
  const TEAMS = { mudguts: 'Mudguts', pissants: 'Pissants' };
  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rpc = (fn, body) => fetch(`${SUPA}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: ANON, Authorization: `Bearer ${ANON}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json());
  let pass = '', st = null, got = 0, online = true, busy = false;
  try { pass = sessionStorage.getItem('yc-sb') || ''; } catch (_) {}

  // ---------- passcode gate ----------
  function gate(msg) {
    app.innerHTML = `<div class="gate"><img class="wm" src="${A}wordmark-cream.webp" alt="Yappers Cup">
      <p class="d" style="margin:0;font-size:22px;letter-spacing:.12em">Match scoreboard</p>
      <form><input name="p" type="password" autocomplete="off" autocapitalize="characters" placeholder="Passcode" aria-label="Passcode" required>
      <button class="btn" type="submit">Open scoreboard</button><p class="err" role="alert">${esc(msg || '')}</p></form></div>`;
    const f = app.querySelector('form'); f.elements.p.focus();
    f.onsubmit = async e => {
      e.preventDefault(); const b = f.querySelector('button'); b.disabled = true; b.textContent = 'Checking…';
      const r = await rpc('yc_score_get', { p_pass: f.elements.p.value }).catch(() => ({ ok: false, error: 'Check your signal and try again.' }));
      if (!r.ok) { b.disabled = false; b.textContent = 'Open scoreboard'; f.querySelector('.err').textContent = r.error || 'Wrong passcode.'; return; }
      pass = f.elements.p.value; try { sessionStorage.setItem('yc-sb', pass); } catch (_) {}
      take(r); board();
    };
  }

  // ---------- state ----------
  function take(r) { st = r; got = performance.now(); }
  const total = (g, b) => g * 6 + b;
  const elapsed = () => !st ? 0 : st.elapsed_ms + (st.running ? performance.now() - got : 0);
  const fmt = ms => { const s = Math.floor(Math.max(0, ms) / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

  async function poll() {
    if (!pass || busy) return;
    try { const r = await rpc('yc_score_get', { p_pass: pass }); if (r.ok) { take(r); online = true; paint(); } else { pass = ''; gate(r.error); } }
    catch (_) { online = false; paint(); }
  }
  async function act(action, team) {
    busy = true;
    try {
      const r = await rpc('yc_score_act', { p_pass: pass, p_action: action, p_team: team || null });
      if (r.ok) { take(r); online = true; } else if (r.error === 'Wrong passcode.') { pass = ''; gate(r.error); return; }
    } catch (_) { online = false; }
    busy = false; paint();
  }

  // ---------- board ----------
  function board() {
    app.innerHTML = `
      <div class="top"><img src="${A}lockup-small.png" alt="Yappers Cup"><span class="live"><i></i><b>LIVE</b></span>
        <button class="btn ghost exit" data-a="display" style="padding:8px 14px;font-size:14px">Show controls</button></div>
      <div class="clock"><div class="half d"></div><div class="time d"></div><div class="note"></div></div>
      <div class="teams">${Object.keys(TEAMS).map(t => `
        <div class="team ${t}"><span class="lead" hidden>LEADING</span>
          <img src="${A}shield-${t}.webp" alt="">
          <div class="name d">${TEAMS[t]}</div>
          <div class="total d" data-total="${t}">0</div>
          <div class="gb d" data-gb="${t}">0.0</div>
          <div class="add"><button class="btn d" data-a="goal" data-t="${t}">+ Goal</button><button class="btn d" data-a="behind" data-t="${t}">+ Behind</button></div>
        </div>`).join('')}</div>
      <p class="margin d"></p>
      <div class="controls">
        <button class="btn wide" data-a="clock">Start clock</button>
        <button class="btn ghost" data-a="undo">Undo last score</button>
        <button class="btn ghost" data-a="half">Next half</button>
        <button class="btn ghost" data-a="reset_clock">Reset clock</button>
        <button class="btn ghost" data-a="display">Display mode</button>
        <button class="btn ghost wide" data-a="reset_all">Reset match</button>
      </div>
      <p class="hint">Scores sync to every phone with the passcode. Display mode hides the buttons for a big screen.</p>
      <div class="log"><h2 class="d">Scoring</h2><div class="items"></div></div>`;
    paint();
  }

  function paint() {
    if (!st || !app.querySelector('.teams')) return;
    const mud = total(st.mud_g, st.mud_b), pis = total(st.pis_g, st.pis_b), e = elapsed(), over = e >= HALF_MS;
    app.querySelector('.half').textContent = st.half === 1 ? '1st half' : '2nd half';
    const tm = app.querySelector('.time'); tm.textContent = fmt(e); tm.classList.toggle('over', over);
    app.querySelector('.note').textContent = over ? (st.half === 1 ? 'HALF TIME' : 'FULL TIME') : (st.running ? '' : (e > 0 ? 'CLOCK PAUSED' : ''));
    for (const [t, g, b, sc] of [['mudguts', st.mud_g, st.mud_b, mud], ['pissants', st.pis_g, st.pis_b, pis]]) {
      app.querySelector(`[data-total="${t}"]`).textContent = sc;
      app.querySelector(`[data-gb="${t}"]`).textContent = `${g}.${b}`;
      app.querySelector(`.team.${t} .lead`).hidden = !(sc > (t === 'mudguts' ? pis : mud));
    }
    const diff = Math.abs(mud - pis);
    app.querySelector('.margin').textContent = mud === pis ? (mud ? 'Scores level' : 'No score yet') : `${mud > pis ? 'Mudguts' : 'Pissants'} by ${diff} point${diff === 1 ? '' : 's'}`;
    const cb = app.querySelector('[data-a="clock"]'); cb.textContent = st.running ? 'Pause clock' : (e > 0 ? 'Resume clock' : 'Start clock');
    app.querySelector('[data-a="half"]').textContent = st.half === 1 ? 'Start 2nd half' : 'Back to 1st half';
    const lv = app.querySelector('.live'); lv.classList.toggle('off', !online); lv.querySelector('b').textContent = online ? 'LIVE' : 'RECONNECTING';
    const items = app.querySelector('.log .items');
    items.innerHTML = (st.events || []).slice().reverse().map(ev => `<div><b>${TEAMS[ev.t] || ''} ${ev.k === 'g' ? 'goal' : 'behind'}</b><span>${ev.half === 1 ? '1st' : '2nd'} half · ${new Date(ev.at).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' })}</span></div>`).join('') || '<div><span>No scores yet.</span></div>';
  }

  function confirmBox(title, text, yes, fn) {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><h3 class="d">${esc(title)}</h3><p>${esc(text)}</p><div class="row"><button class="btn" data-x="y">${esc(yes)}</button><button class="btn ghost" data-x="n">Cancel</button></div></div>`;
    document.body.append(m);
    m.onclick = e => { const x = e.target.closest('[data-x]'); if (e.target === m || (x && x.dataset.x === 'n')) m.remove(); else if (x) { m.remove(); fn(); } };
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b || !st) return;
    const a = b.dataset.a;
    if (a === 'goal' || a === 'behind') { act(a, b.dataset.t); if (navigator.vibrate) navigator.vibrate(30); }
    else if (a === 'clock') act(st.running ? 'pause' : 'start');
    else if (a === 'undo') act('undo');
    else if (a === 'half') confirmBox(st.half === 1 ? 'Start the 2nd half?' : 'Back to the 1st half?', 'The clock goes back to 0:00. Scores stay as they are.', 'Yes', () => act('half'));
    else if (a === 'reset_clock') confirmBox('Reset the clock?', 'The clock goes back to 0:00 for this half.', 'Reset clock', () => act('reset_clock'));
    else if (a === 'reset_all') confirmBox('Reset the whole match?', 'Both scores go back to zero and the clock restarts at the 1st half. This can\'t be undone.', 'Reset match', () => act('reset_all'));
    else if (a === 'display') document.body.classList.toggle('display');
  });

  setInterval(() => { if (st && st.running) paint(); }, 250);
  setInterval(poll, 2000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
  if (pass) rpc('yc_score_get', { p_pass: pass }).then(r => { if (r.ok) { take(r); board(); } else gate(); }).catch(() => gate('Check your signal and try again.'));
  else gate();
})();
</script>
</body>
</html>
