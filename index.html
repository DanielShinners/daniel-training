<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E4E6EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Squiz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Squiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap">
<style>
/* Ron Design language: cool grey ground, frosted cards, cobalt hero, lime selection.
   Heart-rate zones keep their hue families (slate, teal, gold, orange, rose, violet) so they stay distinguishable from each other and from the cobalt/lime UI. */
:root{
  --bg:#E4E6EB; --card:rgba(255,255,255,.68); --sunken:rgba(22,26,36,.055); --input:rgba(255,255,255,.9);
  --ink:#1C1E24; --ink2:#5C6270; --ink3:#8B909C; --line:rgba(22,26,36,.08); --line2:rgba(22,26,36,.14);
  --accent:#2A56F6; --accent-ink:#FFFFFF; --accentSoft:rgba(42,86,246,.12);
  --lime:#D8F34A; --lime-ink:#17200A;
  --nav:rgba(255,255,255,.94);
  --mbase:#E6E8EE; --mline:#C5C9D3; --dark:#1A1D27; --dark2:#2A2E3A; --dline:rgba(255,255,255,.14); --on:#F4F6FA; --on2:rgba(244,246,250,.7); --on3:rgba(244,246,250,.42);
  --z-rec:#8E9AAB; --z-st:#1296A3; --z-mp:#E0A31A; --z-lt2:#F06A2F; --z-vo2:#E25060; --z-sp:#7A5AF0; --z-x:#C4C7D0;
  --good:#178A56; --warn:#B45309; --bad:#D64545;
  --cat-ball:#F97316; --cat-run:#D8F34A; --cat-run-ink:#17200A; --cat-gym:#FF0A27; --cat-gym-ink:#fff; --cat-ink:#1C1206; --cat-rest:#E4E6EB; --cat-rest-ink:#5C6270;
  --holo:linear-gradient(100deg,#8AF6FF 0%,#D8F34A 36%,#F7F7FF 58%,#D0B4FF 80%,#8AF6FF 100%);
  --shadow:0 1px 0 rgba(255,255,255,.75) inset, 0 10px 28px -20px rgba(22,30,48,.35);
  --space-gap:8px; --space-pad-y:10px; --space-pad-x:12px; --space-radius:22px; --space-line:1.25; --space-rhythm:8px;
  --sans:"Outfit","Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:var(--sans);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101218; --card:rgba(32,36,48,.82); --sunken:rgba(255,255,255,.06); --input:rgba(255,255,255,.08);
  --ink:#F3F4F8; --ink2:rgba(243,244,248,.7); --ink3:rgba(243,244,248,.46); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --accent:#4C74FF; --accentSoft:rgba(76,116,255,.2);
  --lime:#D6F24A; --lime-ink:#142008;
  --nav:rgba(16,18,26,.92);
  --mbase:#2A2E3A; --mline:#3C4252; --dark:#0C0E14; --dark2:#222633; --dline:rgba(255,255,255,.12);
  --z-rec:#B4BECC; --z-st:#3DCFC4; --z-mp:#F0B044; --z-lt2:#FF8A55; --z-vo2:#FF7A88; --z-sp:#A78BFA; --z-x:#8B909C;
  --good:#3DCA86; --warn:#F0A35A; --bad:#FF7B7B;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 14px 32px -22px rgba(0,0,0,.65);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101218; --card:rgba(32,36,48,.82); --sunken:rgba(255,255,255,.06); --input:rgba(255,255,255,.08);
  --ink:#F3F4F8; --ink2:rgba(243,244,248,.7); --ink3:rgba(243,244,248,.46); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --accent:#4C74FF; --accentSoft:rgba(76,116,255,.2);
  --lime:#D6F24A; --lime-ink:#142008;
  --nav:rgba(16,18,26,.92);
  --mbase:#2A2E3A; --mline:#3C4252; --dark:#0C0E14; --dark2:#222633; --dline:rgba(255,255,255,.12);
  --z-rec:#B4BECC; --z-st:#3DCFC4; --z-mp:#F0B044; --z-lt2:#FF8A55; --z-vo2:#FF7A88; --z-sp:#A78BFA; --z-x:#8B909C;
  --good:#3DCA86; --warn:#F0A35A; --bad:#FF7B7B;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 14px 32px -22px rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:0;background:var(--bg)}
body{margin:0;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}[hidden]{display:none!important}
.signin{max-width:440px;margin:0 auto;padding:max(9vh,40px) 16px 48px}
html,body{background:var(--bg)}
body{
  color:var(--ink);font-family:var(--sans);font-size:15px;font-weight:400;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 420px at -8% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 56%),
    radial-gradient(720px 380px at 112% -12%, color-mix(in srgb, var(--lime) 22%, transparent), transparent 52%),
    radial-gradient(800px 480px at 90% 110%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 50%),
    var(--bg);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:color-mix(in srgb, var(--accent) 24%, transparent)}
.mono{font-family:var(--sans);font-variant-numeric:tabular-nums;font-weight:400}
.eb{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink3)}
.eb.acc{color:var(--accent)}
.dk .eb{color:var(--on3)}
h1{font-size:34px;font-weight:300;letter-spacing:-.04em;line-height:1.05;margin:6px 0 0;text-wrap:balance}
h2{font-size:22px;font-weight:400;letter-spacing:-.03em;line-height:var(--space-line);margin:0}
.lede{color:var(--ink2);font-size:14px;margin-top:var(--space-rhythm)}
.dk .lede{color:var(--on2)}

/* Shell */
.top{position:sticky;top:0;z-index:12;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb, var(--bg) 78%, transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;border-radius:22%;display:block;flex:none;object-fit:cover}
.brand{font-weight:500;letter-spacing:-.02em;font-size:16px}
.top .sp{flex:1}
.race{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;box-shadow:var(--shadow)}
.race b{color:var(--accent);font-weight:500}
.nav{position:fixed;z-index:25;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(460px,calc(100% - 20px));display:flex;gap:2px;background:var(--nav);backdrop-filter:blur(18px) saturate(1.35);-webkit-backdrop-filter:blur(18px) saturate(1.35);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:0 14px 40px -18px rgba(16,22,40,.45)}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:7px 2px 6px;border-radius:18px;font-size:10px;font-weight:500;letter-spacing:-.01em;line-height:1.1;color:var(--ink3)}
.nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{background:var(--accent);color:#fff}
.nav button[data-tab="gym"][aria-current="page"]{background:var(--cat-gym);color:var(--cat-gym-ink)}
.nav button[data-tab="ball"][aria-current="page"]{background:var(--cat-ball);color:var(--cat-ink)}
.nav button[data-tab="run"][aria-current="page"]{background:var(--cat-run);color:var(--cat-run-ink)}
.nav button[aria-current="page"] svg{stroke:currentColor;background:transparent}
.head.cat-gym h1{box-shadow:inset 0 -4px 0 var(--cat-gym);padding-bottom:2px}
.head.cat-ball h1{box-shadow:inset 0 -4px 0 var(--cat-ball);padding-bottom:2px}
.head.cat-run h1{box-shadow:inset 0 -4px 0 var(--cat-run);padding-bottom:2px}
.chip.c-gym,.btn.c-gym{background:var(--cat-gym);color:var(--cat-gym-ink)}
.chip.c-ball,.btn.c-ball{background:var(--cat-ball);color:var(--cat-ink)}
.chip.c-run,.btn.c-run{background:var(--cat-run);color:var(--cat-run-ink)}
.chip.c-rest{background:var(--cat-rest);color:var(--cat-rest-ink)}
.cl-gym{box-shadow:inset 0 -2px 0 var(--cat-gym)}
.cl-ball{box-shadow:inset 0 -2px 0 var(--cat-ball)}
.cl-run{box-shadow:inset 0 -2px 0 var(--cat-run)}
.cl-rest{box-shadow:inset 0 -2px 0 var(--cat-rest)}
.m.c-gym .k,.m.c-ball .k,.m.c-run .k{display:inline-block;border-radius:999px;padding:2px 8px}
.m.c-gym .k{background:var(--cat-gym);color:var(--cat-gym-ink)}
.m.c-ball .k{background:var(--cat-ball);color:var(--cat-ink)}
.m.c-run .k{background:var(--cat-run);color:var(--cat-run-ink)}
.qa-sp button[data-cc="gym"][aria-pressed=true]{background:var(--cat-gym)!important;border-color:var(--cat-gym)!important;color:var(--cat-gym-ink)!important}
.qa-sp button[data-cc="ball"][aria-pressed=true]{background:var(--cat-ball)!important;border-color:var(--cat-ball)!important;color:var(--cat-ink)!important}
.qa-sp button[data-cc="run"][aria-pressed=true]{background:var(--cat-run)!important;border-color:var(--cat-run)!important;color:var(--cat-run-ink)!important}
.rb-scroll{display:flex;gap:8px;overflow-x:auto;align-items:flex-end;margin-top:12px;padding-bottom:4px}
.rb{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;background:none;border:0;color:inherit;padding:0;cursor:pointer;min-height:210px}
.rb-pace{font-size:11px;font-weight:500;color:var(--on)}
.rb-spd{font-size:10px;color:var(--on3);min-height:12px}
.rb-bar{width:100%;border-radius:10px 10px 4px 4px;background:var(--cat-run);color:var(--cat-run-ink);display:flex;align-items:flex-start;justify-content:center;padding-top:4px;min-height:16px}
.rb-bar b{font-size:11px;font-weight:500}
.rb-bar.ball{background:var(--cat-ball);color:var(--cat-ink)}
.rb-bar.gym{background:var(--cat-gym);color:var(--cat-gym-ink)}
.rb-bar.plan{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.34) 0 5px,rgba(255,255,255,.1) 5px 10px);color:rgba(255,255,255,.78);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.rb-date{font-size:10px;color:var(--on2);text-align:center;line-height:1.2}
.rb.plan .rb-date{opacity:.75}
.rb-swatch{background:var(--cat-run)!important}
.rb-swatch.ball{background:var(--cat-ball)!important}
.rb-swatch.gym{background:var(--cat-gym)!important}
.rb-swatch.plan{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.7) 0 3px,rgba(255,255,255,.25) 3px 6px)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
#topbar:not([hidden]) ~ #app{padding-bottom:calc(156px + env(safe-area-inset-bottom,0px))}
#topbar:not([hidden]) ~ #fab{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
#topbar:not([hidden]) ~ #toastRoot .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
@media (min-width:880px){
  .nav{position:sticky;top:56px;bottom:auto;left:auto;transform:none;margin:0 auto;width:min(520px,calc(100% - 32px));z-index:13}
  #topbar:not([hidden]) ~ #app{padding-bottom:72px}
  #topbar:not([hidden]) ~ #fab{bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  #topbar:not([hidden]) ~ #toastRoot .toast{bottom:calc(22px + env(safe-area-inset-bottom,0px))}
}
section.card[style*="border-left"]{border-left-width:0!important;box-shadow:inset 4px 0 0 var(--zc, var(--accent)), var(--shadow)}
@media (max-width:520px){.nav{width:calc(100% - 12px)}.nav button{font-size:9px;letter-spacing:-.03em;padding:7px 0 6px}}
@media (max-width:360px){.nav button{font-size:9px;padding:6px 0 5px}.nav svg{width:16px;height:16px}}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:12px 48px;display:flex;flex-direction:column;gap:var(--space-gap)}
.wrap > :not(.head){margin-top:0!important;margin-bottom:0!important}
.head{margin:6px 2px calc(16px - var(--space-gap))}
.cols{display:grid;gap:var(--space-gap)}
@media (min-width:880px){.cols.two{grid-template-columns:1.05fr 1fr;align-items:start}.span2{grid-column:1/-1}}
.stack{display:grid;gap:var(--space-gap);min-width:0}
.stack > *,.cols > *{margin-top:0!important;margin-bottom:0!important}
#meal-shop{display:flex;flex-direction:column;gap:var(--space-gap)}
#meal-shop > *{margin-top:0!important;margin-bottom:0!important}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--space-radius);box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);min-width:0}
.dk{
  background:
    radial-gradient(420px 200px at 88% 0%, rgba(255,255,255,.18), transparent 55%),
    linear-gradient(165deg,#3E6DFF 0%,#2454F5 46%,#1B43E0 100%);
  color:var(--on);border:0;border-radius:var(--space-radius);min-width:0;
  box-shadow:0 18px 40px -24px rgba(26,60,210,.7);
  --on:#fff; --on2:rgba(255,255,255,.74); --on3:rgba(255,255,255,.5);
  --accent:var(--lime); --accent-ink:var(--lime-ink); --accentSoft:rgba(216,243,74,.18);
  --dark2:rgba(255,255,255,.14); --dline:rgba(255,255,255,.18); --line:rgba(255,255,255,.16);
  --mbase:rgba(255,255,255,.14); --mline:rgba(255,255,255,.28);
  --ink:var(--on); --ink2:var(--on2); --ink3:var(--on3);
}
.pad{padding:var(--space-pad-y) var(--space-pad-x)}
.pad > * + *,.pad form:not(.grid2):not(.composer) > * + *{margin-top:var(--space-rhythm)!important}
.card .eb + h2,.dk .eb + h2{margin-top:var(--space-rhythm)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sub{color:var(--ink2);font-size:13px}
.dk .sub{color:var(--on2)}
.inset{background:var(--dark2);border-radius:18px;padding:14px}
.card .inset{background:var(--sunken)}
.holo{background:var(--holo);background-size:160% 100%}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.metrics button{width:100%;text-align:left}
@media (max-width:520px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.m .k{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink3)}
.dk .m .k{color:var(--on3)}
.m .v{font-family:var(--sans);font-size:30px;font-weight:300;letter-spacing:-.04em;line-height:1.05;margin-top:2px;font-variant-numeric:tabular-nums}
.m .v small{font-size:12px;color:var(--ink3);margin-left:3px;font-weight:400;letter-spacing:0}
.dk .m .v small{color:var(--on3)}

/* Pills / chips */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:11px 16px;font-size:14px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.dk .btn.ghost{color:var(--on);border-color:rgba(255,255,255,.35)}
.btn.block{width:100%;justify-content:center;padding:12px}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;padding:5px 10px;border-radius:999px;background:var(--sunken);color:var(--ink2)}
.dk .chip{background:var(--dark2);color:var(--on)}
.chip i{width:7px;height:7px;border-radius:99px;background:var(--zc,var(--z-x))}
.chip.good{color:var(--good)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)}
.seg{display:inline-flex;background:var(--sunken);border-radius:999px;padding:4px;gap:2px}
.dk .seg{background:rgba(255,255,255,.14)}
.seg button{font-family:var(--sans);font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;color:var(--ink2)}
.dk .seg button{color:rgba(255,255,255,.78)}
.seg button[aria-pressed="true"],.dk .seg button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink);box-shadow:none}

/* Zone colours. Hue families follow the old set: slate, teal, gold, orange, rose, violet. */
.z-rec{--zc:var(--z-rec)} .z-st{--zc:var(--z-st)} .z-mp{--zc:var(--z-mp)} .z-lt2{--zc:var(--z-lt2)} .z-vo2{--zc:var(--z-vo2)} .z-sp{--zc:var(--z-sp)} .z-x{--zc:var(--z-x)} .z-race{--zc:var(--z-lt2)}
.pace{font-family:var(--sans);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--zc,inherit)}

/* Session (cobalt hero) */
.sess-t{font-size:28px;font-weight:400;letter-spacing:-.03em;line-height:var(--space-line);margin:0}
.sess-m{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--on2)}
.card .sess-m{color:var(--ink2)}
.how{margin-top:14px;font-size:15px;line-height:1.55}
.how b{font-weight:600}
.bul{display:grid;gap:8px;margin-top:12px;font-size:14px}
.bul div{display:grid;grid-template-columns:10px 1fr;gap:8px}
.bul div::before{content:"";width:7px;height:7px;border-radius:99px;margin-top:7px;background:var(--accent)}
.coach{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:12px 14px;border-radius:18px;background:var(--accentSoft);font-size:14px}
.coach .eb{color:var(--accent);margin-top:2px}
.dk .coach{background:rgba(216,243,74,.16)}

/* Week bars */
.bars{width:100%;height:auto;display:block;margin-top:10px}
.bars text{font-family:var(--sans);font-size:10px;font-weight:500;fill:var(--ink3)}
.dk .bars text{fill:var(--on3)}
.lro{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--sans);font-size:12px;font-variant-numeric:tabular-nums;color:var(--on2);margin:14px 0 4px;min-height:16px}
.lro b{color:var(--on);font-weight:500}
.dotk{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:8px;vertical-align:1px;flex:none}
.acts{margin-top:12px}
.act{display:flex;align-items:flex-start;gap:0;padding:10px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .dotk{margin-top:6px}
.act-a{flex:1;min-width:0;display:flex;flex-direction:column}
.act-a b{font-weight:500}
.act-n{text-align:right;display:flex;flex-direction:column;font-family:var(--sans);font-variant-numeric:tabular-nums}
.act-n b{font-size:20px;font-weight:300;letter-spacing:-.03em}
.act-n .sub{font-size:10px}
.wk-list{margin-top:10px}
.wk-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) auto;gap:12px;align-items:center;width:100%;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.wk-row:first-child{border-top:0}
.wk-a{display:flex;flex-direction:column;min-width:0}
.wk-a b{font-weight:500}
.wk-a .sub{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--sunken)}
.wk-bar i{display:block;height:100%;opacity:.9}
.wk-n{display:flex;flex-direction:column;text-align:right;font-family:var(--sans);font-variant-numeric:tabular-nums;min-width:64px}

/* Day rows */
.days{display:grid;gap:var(--space-gap)}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--space-radius);padding:var(--space-pad-y) var(--space-pad-x);box-shadow:inset 3px 0 0 var(--zc, var(--z-x)), var(--shadow)}
.dk .day{background:var(--dark2);border-color:transparent;color:var(--on)}
.tile{display:grid;justify-items:center;line-height:1;gap:3px;padding:6px 0;border-radius:14px;background:var(--sunken)}
.dk .tile{background:rgba(255,255,255,.08)}
.tile .a{font-family:var(--sans);font-size:9px;font-weight:500;letter-spacing:.06em;color:var(--ink3)}
.dk .tile .a{color:var(--on3)}
.tile .b{font-size:18px;font-weight:400;letter-spacing:-.03em}
.day.c-gym{box-shadow:inset 3px 0 0 var(--cat-gym), var(--shadow)}
.day.c-ball{box-shadow:inset 3px 0 0 var(--cat-ball), var(--shadow)}
.day.c-run{box-shadow:inset 3px 0 0 var(--cat-run), var(--shadow)}
.day.c-rest{box-shadow:inset 3px 0 0 var(--cat-rest), var(--shadow)}
.day.c-mix{background:linear-gradient(to bottom,var(--cat-ball) 0 50%,var(--cat-gym) 50% 100%) left center / 3px 100% no-repeat,var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.day .t{font-weight:500;line-height:var(--space-line)}
.day .s{font-size:12px;color:var(--ink3);margin-top:2px;font-family:var(--sans)}
.dk .day .s{color:var(--on3)}
.day.done .t{text-decoration:line-through;text-decoration-color:var(--ink3);color:var(--ink2)}
.dk .day.done .t{color:var(--on2);text-decoration-color:var(--on3)}
.day .r{font-family:var(--sans);font-size:16px;color:var(--ink3);text-align:right}
.ok{color:var(--good)} .miss{color:var(--bad)} .part{color:var(--warn)}

/* Recipe rows */
.rec{display:grid;gap:14px;margin-top:14px}
.rec-r{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end}
.rec-r .n{font-weight:500}
.rec-r .d{font-family:var(--sans);font-size:12px;color:var(--ink3)}
.rec-r .v{grid-row:1/3;grid-column:2;text-align:right;font-family:var(--sans);font-size:26px;font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.rec-r .v small{display:block;font-size:9.5px;font-weight:500;letter-spacing:.04em;color:var(--ink3);margin-top:3px}
.rec-r .bar{grid-column:1/-1;height:6px;border-radius:999px;background:var(--sunken);overflow:hidden;margin-top:6px}
.rec-r .bar div{height:100%;background:var(--zc);border-radius:999px}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:10px 0;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.dk .tbl td,.dk .tbl th{border-top-color:var(--dline)}
.tbl tr:first-child td{border-top:0}
.tbl .r{text-align:right;font-family:var(--sans);font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:9px;height:9px;border-radius:99px;background:var(--zc);margin-right:8px}

/* Forms */
.field{display:grid;gap:var(--space-rhythm);margin-top:var(--space-rhythm)}
.field label,.flabel{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink3)}
input:not([type]),input[type=date],input[type=time],input[type=text],input[type=number],input[type=email],input[type=password],textarea,select{font:inherit;font-size:15px;color:var(--ink);background:var(--input);border:1px solid transparent;border-radius:16px;padding:12px 14px;width:100%}
textarea{min-height:64px;resize:vertical}
.scale{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.scale button{font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:13px;font-weight:500;padding:8px 0;border-radius:12px;background:var(--input);color:var(--ink2)}
.scale button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink)}
.sw-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}
.tog{width:44px;height:26px;border-radius:999px;background:var(--line2);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s}
.tog[aria-checked="true"]{background:var(--good)}
.tog[aria-checked="true"]::after{transform:translateX(18px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-gap)}
.hr{height:1px;background:var(--line);margin:18px 0 4px}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(12,14,20,.46);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:760px){.scrim{align-items:center}}

<script>

<script>
(function(){
"use strict";
let RACE_DATE="2099-01-01";
/* Supabase */
const SB=window.supabase.createClient(window.APP_CONFIG.supabaseUrl,window.APP_CONFIG.supabaseKey,{auth:{storageKey:"dt-auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit"}});
function makeDb(sb){
  const subs={};let chan=null;
  async function load(col){const {data,error}=await sb.from("dt_docs").select("id,data").eq("collection",col).limit(5000);if(error)throw error;return data;}
  function snapOf(rows){return {docs:rows.map(r=>({id:r.id,exists:true,data:()=>r.data}))};}
  async function emit(col){const l=subs[col];if(!l)return;try{const rows=await load(col);l.forEach(f=>f(rows));}catch(e){l.forEach(f=>f(null,e));}}
  function ensureChan(){if(chan)return;chan=sb.channel("dt").on("postgres_changes",{event:"*",schema:"public",table:"dt_docs"},p=>{const c=(p.new&&p.new.collection)||(p.old&&p.old.collection);if(c)emit(c);else Object.keys(subs).forEach(emit);}).subscribe();}
  function listen(col,f){(subs[col]=subs[col]||[]).push(f);ensureChan();load(col).then(r=>f(r),e=>f(null,e));}
  async function put(col,id,data){const {error}=await sb.from("dt_docs").upsert({collection:col,id,data},{onConflict:"collection,id"});if(error)throw error;emit(col);}
  return {
    refresh(){Object.keys(subs).forEach(emit);},
    collection(col){const api={limit(){return api;},doc(id){return {set:d=>put(col,id,d)};},onSnapshot(next,err){listen(col,(rows,e)=>{if(e){err&&err(e);return;}next(snapOf(rows));});return ()=>{};}};return api;},
    doc(path){const [col,id]=path.split("/");return {set:d=>put(col,id,d),onSnapshot(next,err){listen(col,(rows,e)=>{if(e){err&&err(e);return;}const r=rows.find(x=>x.id===id);next({exists:!!r,data:()=>r&&r.data});});return ()=>{};}};}
  };
}
function bindSignin(){
$("#siPwF").onsubmit=async e=>{e.preventDefault();const b=$("#siPwGo");b.disabled=true;
  const {error}=await SB.auth.signInWithPassword({email:$("#siE").value.trim(),password:$("#siP").value});
  b.disabled=false;if(error)$("#siMsg").textContent=/invalid/i.test(error.message)?"Email or password not right. No password yet? Use the sign-in link below first.":("Couldn't sign in: "+error.message);else startData();};
$("#siLink").onclick=async()=>{const email=$("#siE").value.trim();if(!email){$("#siMsg").textContent="Enter your email first.";return;}
  const {error}=await SB.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});
  $("#siMsg").textContent=error?("Couldn't send: "+error.message):"Sent. Tap Log In in the email.";};
}
function passwordPrompt(){
  let done=false;try{done=localStorage.getItem("dt-pw")==="1";}catch(e){}
  const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if(done||standalone)return;
  const box=document.createElement("section");box.className="card pad";box.style.margin="0 0 14px";box.id="pwBox";
  box.innerHTML='<div class="eb acc">One more step</div><h2>Set a password for the app</h2><div class="sub" style="margin-top:4px">The home screen app keeps its own sign-in, separate from Safari. Set a password here, then sign in once in the app with your email and this password.</div><form id="pwF"><div class="field"><label for="pwN">New password</label><input id="pwN" type="password" autocomplete="new-password" minlength="8" required></div><button class="btn block" style="margin-top:12px" type="submit">Save password</button></form><button class="btn ghost" id="pwSkip" type="button" style="margin-top:10px">I already have one</button>';
  $("#app").prepend(box);
  $("#pwF").onsubmit=async e=>{e.preventDefault();const {error}=await SB.auth.updateUser({password:$("#pwN").value});
    if(error){toast("Couldn't save: "+error.message);return;}try{localStorage.setItem("dt-pw","1");}catch(_){}box.remove();toast("Password saved. Now sign in from the home screen app.");};
  $("#pwSkip").onclick=()=>{try{localStorage.setItem("dt-pw","1");}catch(_){}box.remove();};
}
function showSignin(){$("#signin").hidden=false;$("#app").hidden=true;$("#topbar").hidden=true;$("#nav").hidden=true;}
function hideSignin(){$("#signin").hidden=true;$("#app").hidden=false;$("#topbar").hidden=false;$("#nav").hidden=false;}

const S={chat:[],weeks:{},pastweeks:{},runs:{},log:{},lifts:{},notes:[],weights:{},adjust:{},settings:{},db:null,loaded:false};
function hasVdot(){const v=S.settings&&S.settings.vdot;return v!=null&&v!==""&&isFinite(+v)&&+v>0;}
const UI={tab:"today",sel:null,openWeek:null,recipe:4,showPast:false};
try{const t=localStorage.getItem("dt-tab"); if(t) UI.tab=t;}catch(e){}

/* utils */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const p2=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const pISO=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);};
const addD=(s,n)=>{const d=pISO(s);d.setDate(d.getDate()+n);return iso(d);};
const TODAY=iso(new Date());
const dBetween=(a,b)=>Math.round((pISO(b)-pISO(a))/864e5);
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fD=(s,dow)=>{const d=pISO(s);return (dow?DOW[d.getDay()]+" ":"")+d.getDate()+" "+MON[d.getMonth()];};
const fDur=sec=>{sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+":"+p2(m)+":"+p2(s):m+":"+p2(s);};
const fP=spk=>{if(!isFinite(spk)||spk<=0)return "n/a";let m=Math.floor(spk/60),s=Math.round(spk%60);if(s===60){m++;s=0;}return m+":"+p2(s);};
function pDur(t){if(t==null)return NaN;t=String(t).trim();if(!t||t==="--")return NaN;if(/^\d+(\.\d+)?$/.test(t))return parseFloat(t);const p=t.split(":").map(parseFloat);if(p.some(isNaN))return NaN;return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:NaN;}
const num=v=>{if(v==null)return NaN;const s=String(v).replace(/,/g,"").trim();if(!s||s==="--")return NaN;return parseFloat(s);};
function toast(m){const r=$("#toastRoot");r.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",2600);}

/* VDOT (Daniels and Gilbert) */
const vo2=v=>-4.60+0.182258*v+0.000104*v*v;
const pct=t=>0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
const vdotFrom=(d,sec)=>{const t=sec/60;return vo2(d/t)/pct(t);};
function predict(v,d){let lo=1,hi=900;for(let i=0;i<70;i++){const m=(lo+hi)/2;if(vdotFrom(d,m*60)>v)lo=m;else hi=m;}return (lo+hi)/2*60;}
function paceF(f,v){const a=.000104,b=.182258,c=4.6+f*v;return 60000/((-b+Math.sqrt(b*b+4*a*c))/(2*a));}
/* Pace zones only when a VDOT has been saved. Otherwise the written paces on each day stand. */
function ZONES(){
  if(!hasVdot())return [];
  const v=+S.settings.vdot, L=+S.settings.lthr||0;
  const hr=(a,b)=>L?(a?Math.round(L*a):"")+(a&&b?" to ":"")+(b?Math.round(L*b):"")+(!a?"under ":"")+" bpm":"";
  const eF=paceF(.70,v), eS=paceF(.62,v), T=paceF(.88,v), I=paceF(.98,v), R=paceF(1.07,v);
  return [
    {k:"rec",n:"Recovery",slow:9999,fast:eS,txt:"slower than "+fP(eS),hr:L?"under "+Math.round(L*.81)+" bpm":"",use:"Shakeouts and the day after hard work."},
    {k:"st",n:"Easy",slow:eS,fast:eF,txt:fP(eF)+" to "+fP(eS),hr:L?Math.round(L*.81)+" to "+Math.round(L*.89)+" bpm":"",use:"Most of your running. Full sentences."},
    {k:"lt2",n:"Tempo",slow:eF,fast:(T+I)/2,txt:fP(T)+" (±5s)",hr:L?Math.round(L*.95)+" to "+Math.round(L*1.0)+" bpm":"",use:"Sustained hard running."},
    {k:"vo2",n:"Reps",slow:(T+I)/2,fast:(I+R)/2,txt:fP(I),hr:L?"over "+Math.round(L*1.0)+" bpm":"",use:"Short repetitions."},
    {k:"sp",n:"Strides",slow:(I+R)/2,fast:0,txt:fP(R)+" or faster",hr:"",use:"Strides. Fast and relaxed."}
  ];
}
const zoneByKey=k=>ZONES().find(z=>z.k===k);
function zoneOfPace(spk){if(!hasVdot()||!isFinite(spk))return "x";const Z=ZONES();for(const z of Z){if(spk<=z.slow&&spk>z.fast)return z.k;}return spk>Z[0].fast?"rec":"sp";}
function zoneText(k){if(!hasVdot())return "";const v=+S.settings.vdot;
  return k==="E"?fP(paceF(.70,v))+" to "+fP(paceF(.62,v))+"/km":k==="T"?fP(paceF(.88,v))+"/km":k==="I"?fP(paceF(.98,v))+"/km":k==="R"?fP(paceF(1.07,v))+"/km":"";}
const ZK={E:"st",T:"lt2",I:"vo2",R:"sp"};
const fill=t=>esc(t).replace(/(slower than|no faster than) \{E\}/gi,(m,w)=>{const pace=zoneText('E');return pace?w+' <span class="pace z-rec">'+pace.split(' to ')[1].replace('/km','')+'/km</span>':w;}).replace(/\{(E|T|I|R)\}/g,(m,k)=>zoneText(k)?'<span class="pace z-'+ZK[k]+'">'+zoneText(k)+'</span>':m);

/* Session kind to zone */
const KZ={easy:"st",recovery:"rec",long:"st",threshold:"lt2",quality:"vo2",race:"race",rest:"x",cross:"x",strength:"x"};
function sessZone(d){if(d.kind==="quality"&&/\{R\}/.test(d.detail||""))return "sp";return KZ[d.kind]||"x";}
const KLABEL={easy:"Easy",recovery:"Recovery",long:"Long run",threshold:"Tempo",quality:"Reps",race:"Time trial",rest:"Rest",cross:"Other",strength:"Gym"};
const RUN_KINDS={easy:1,recovery:1,long:1,threshold:1,quality:1,race:1};
function catOf(x){
  if(!x)return "other";
  const title=String(x.title||x.name||""), extra=String(x.extra||""), type=String(x.type||""), kind=x.kind||"";
  if(RUN_KINDS[kind]||(isRun(x)&&+x.km>0))return "run";
  if(/gym/i.test(title)||kind==="strength")return "gym";
  if(/basketball/i.test(title)||/basketball/i.test(type))return "ball";
  if(/gym/i.test(extra)&&!RUN_KINDS[kind])return "gym";
  if(/soccer/i.test(title))return "other";
  if(kind==="rest")return "rest";
  if(/weight|strength|gym/i.test(type+" "+title))return "gym";
  if(/steam/i.test(title))return "other";
  return "other";
}
function gymKey(d){if(!d||catOf(d)!=="gym")return null;const t=String(d.title||"");if(/full\s*body|\bgym\s*a\b/i.test(t))return "A";if(/\blower\b|\bgym\s*b\b/i.test(t))return "B";if(/\bupper\b|\bgym\s*c\b/i.test(t))return "C";return null;}
const CAT_NAME={gym:"Gym",ball:"Basketball",run:"Run",rest:"Rest",other:"Other"};
function plannedDose(d){
  const km=+d.km||0, out={}; if(!km)return out; const add=(k,x)=>{if(x>0)out[k]=(out[k]||0)+x;};
  const det=(d.detail||"")+" "+(d.title||"");
  if(d.kind==="easy"||d.kind==="long")add("st",km);
  else if(d.kind==="recovery")add("rec",km);
  else if(d.kind==="threshold"){add("lt2",km*.55);add("st",km*.45);}
  else if(d.kind==="quality"){const z=/\{R\}/.test(det)?"sp":"vo2";add(z,km*.4);add("st",km*.6);}
  else if(d.kind==="race"){
    const ten=/10\s*km|time trial/i.test(det);
    if(ten||(km>=10&&km<=16)){const work=Math.min(10,km);add("lt2",work);add("st",km-work);}
    else if(km>21){add("lt2",Math.min(km,21.1));add("st",Math.max(0,km-21.1));}
    else add("vo2",km);
  }
  return out;
}

function weekOf(date){let c=null;for(const w of weekList()){const e=addD(w.start,(w.days||[]).length-1);if(date>=w.start&&date<=e)c=w;}return c;}
const isRun=r=>r.sport?r.sport==="run":(!r.type||/run/i.test(r.type));
const runsOn=date=>Object.values(S.runs).filter(r=>r.date===date&&isRun(r));
const otherOn=date=>Object.values(S.runs).filter(r=>r.date===date&&!isRun(r));
const kmOn=date=>runsOn(date).reduce((a,r)=>a+(+r.km||0),0);
function status(d){const lg=S.log[d.date]||{},km=kmOn(d.date);
  if(!(+d.km))return (lg.done||lg.gymDone||otherOn(d.date).length)?"done":"rest";
  if(lg.done||km>0){if(km>0&&km<d.km*.75&&!lg.done)return "part";return "done";}
  if(d.date<TODAY)return "miss";return "todo";}
const wPlan=w=>w&&w.target!=null&&w.target!==""&&isFinite(+w.target)?+w.target:(w&&w.days||[]).reduce((a,d)=>a+(+d.km||0),0);

/* Coach read for a day */
function coachRead(d){
  const rs=runsOn(d.date), lg=S.log[d.date]||{}, km=rs.reduce((a,r)=>a+(+r.km||0),0);
  if(!rs.length&&!lg.done)return null;
  const notes=[]; let tone="good";
  const sec=rs.reduce((a,r)=>a+(+r.sec||0),0), pace=km?sec/km:0;
  const hrs=rs.filter(r=>r.avgHr), hr=hrs.length?hrs.reduce((a,r)=>a+r.avgHr*r.sec,0)/hrs.reduce((a,r)=>a+r.sec,0):0;
  if(+d.km&&km){const r=km/d.km; if(r<.85){notes.push("Ran "+km.toFixed(1)+" of "+d.km+" km planned.");tone="warn";} else if(r>1.15){notes.push(km.toFixed(1)+" km is well over the "+d.km+" planned. Extra volume on easy days still costs recovery.");tone="warn";} else notes.push("Distance on plan.");}
  else if(km) notes.push(km.toFixed(1)+" km logged.");
  if(!hasVdot())return notes.length?{tone,text:notes.join(" ")}:null;
  const Z=ZONES(), st=Z[1]||{fast:0}, L=+S.settings.lthr||0;
  if(pace&&(d.kind==="easy"||d.kind==="recovery"||d.kind==="long")){
    if(pace<st.fast-6){notes.push("Average "+fP(pace)+"/km is quicker than steady ("+fP(st.fast)+" or slower). Easy days only work if they stay easy.");tone="warn";}
    else notes.push("Pace "+fP(pace)+"/km sat in steady aerobic. Exactly right.");
  }   else if(pace&&(d.kind==="threshold"||d.kind==="quality"))notes.push("Average "+fP(pace)+"/km includes warm up and recoveries, so judge the reps from your laps.");
  else if(pace&&d.kind==="long")notes.push("Average "+fP(pace)+"/km across the whole run.");
  if(hr&&L&&(d.kind==="easy"||d.kind==="recovery")&&hr>L*.89){notes.push("Average pulse "+Math.round(hr)+" bpm is above your steady ceiling of "+Math.round(L*.89)+".");tone="warn";}
  if(lg.rpe&&(d.kind==="easy"||d.kind==="recovery")&&lg.rpe>=6){notes.push("Effort "+lg.rpe+"/10 on an easy day. Check sleep, fuel and heat.");tone="warn";}
  if(lg.rpe&&(d.kind==="threshold")&&lg.rpe>=9){notes.push("Threshold should feel 7 to 8 out of 10. A 9 says the pace is too hot or you were tired.");tone="warn";}
  (lg.niggles||[]).filter(n=>+n.score>=4).forEach(n=>{notes.push(n.area+" ("+n.side.toLowerCase()+") at "+n.score+"/10. Ease off and keep logging it.");tone="bad";});
  if(lg.foot!=null&&lg.foot>=4){notes.push("Pain "+lg.foot+"/10. Drop back a step for 2 to 3 days and let me know.");tone="bad";}
  else if(lg.foot!=null&&lg.foot>0)notes.push("Foot "+lg.foot+"/10, inside the limit.");
  return {tone,text:notes.join(" ")};
}

function dayPos(w){const i=w.days.findIndex(d=>d.date===(UI.sel||TODAY));return i<0?0:Math.floor(i/7)*7;}

function melbourneToday(){
  try{return new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Melbourne",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());}
  catch(e){return TODAY;}
}
function weekEnd(w){const days=w.days||[];return days.length?days[days.length-1].date:addD(w.start,6);}

}
function visiblePlanWeeks(){

const GRID_RUN={easy:1,recovery:1,long:1,threshold:1,quality:1,race:1};
function gridParts(d){
  if(!d)return {mode:"one",acts:["rest"]};
  const title=String(d.title||"").trim(), kind=d.kind||"";
  const ball=/basketball/i.test(title);
  const gym=kind==="strength"||(kind==="cross"&&/\bgym\b/i.test(title));
  const run=!!GRID_RUN[kind];
  if(/\bor\b/i.test(title)&&ball&&gym){
    const bi=title.search(/basketball/i), gi=title.search(/\bgym\b/i);
    return {mode:"or",acts:bi>=0&&gi>=0&&bi<gi?["ball","gym"]:["gym","ball"]};
  }
  const marks=[];
  if(ball)marks.push({i:title.search(/basketball/i),k:"ball"});
  if(gym){const gi=title.search(/\bgym\b/i);marks.push({i:gi<0?0:gi,k:"gym"});}
  if(run){const ri=title.search(/\b(run|km|easy|tempo|strides|reps)\b/i);marks.push({i:ri<0?500:ri,k:"run"});}
  marks.sort((a,b)=>a.i-b.i);
  const acts=[]; marks.forEach(m=>{if(!acts.includes(m.k))acts.push(m.k);});
  if(!acts.length)acts.push("rest");
  return {mode:acts.length>1?"and":"one",acts};
}

function recipe(weeks){
  const end=TODAY, start=addD(TODAY,-7*weeks+1); const mins={};
  Object.values(S.runs).filter(r=>isRun(r)&&r.date>=start&&r.date<=end&&r.km>0).forEach(r=>{const z=zoneOfPace(r.sec/r.km);mins[z]=(mins[z]||0)+r.sec/60;});
  const Z=ZONES(); const per=k=>(mins[k]||0)/weeks; const max=Math.max(30,...Z.map(z=>per(z.k)));
  return '<div class="rec">'+Z.map(z=>'<div class="rec-r z-'+z.k+'"><div class="n">'+z.n+'</div><div class="d">'+esc(z.txt)+(z.hr?' · '+esc(z.hr):'')+'</div><div class="v">'+Math.round(per(z.k))+'<small>MIN/WK</small></div><div class="bar"><div style="width:'+(per(z.k)/max*100)+'%"></div></div></div>').join("")+'</div>';
}

function lineChart(points,opts){ // points [{x:date,y:secPerKm}] faster is up

  const x0=Math.min(...xs),x1=Math.max(...xs)||x0+1, yMin=Math.min(...ys)-5, yMax=Math.max(...ys)+5;

  let g="";[yMin+5,(yMin+yMax)/2,yMax-5].forEach(v=>g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="'+(opts.dark?"var(--dline)":"var(--line)")+'"/><text x="'+(L-5)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+fP(v)+'</text>');
  if(opts.goal)g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(opts.goal)+'" y2="'+Y(opts.goal)+'" stroke="var(--accent)" stroke-dasharray="4 4"/><text x="'+(W-R)+'" y="'+(Y(opts.goal)-4)+'" text-anchor="end" style="fill:var(--accent)">GOAL '+fP(opts.goal)+'</text>';
  const d=points.map((p,i)=>(i?"L":"M")+X(xs[i]).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");

function sessionCard(d,w,label){

  return '<div class="stack" id="pastweeks"><div class="head" style="margin-bottom:0"><div class="eb">Before this block</div><h2>Previous weeks</h2><div class="lede">Read only. These weeks sit before the current block and are not counted in it.</div></div>'+ws.map((w,i)=>{
    const sessions=w.sessions||[]; const counts={};
    sessions.forEach(s=>{const c=pastCat(s.type);counts[c]=(counts[c]||0)+1;});
    const line=["gym","ball","run","other"].filter(k=>counts[k]).map(k=>(CAT_NAME[k]||"Other")+" "+counts[k]).join(" · ");
    const cin=w.checkin||{}; const bits=[];
    if(cin.weight_kg)bits.push(esc(cin.weight_kg)+" kg");
    if(cin.average_daily_steps)bits.push(esc(cin.average_daily_steps)+" steps");
    if(cin.energy_1_flat_to_5_great)bits.push("Energy "+esc(cin.energy_1_flat_to_5_great)+"/5");
    if(cin.eating_plan_adherence_1_to_5)bits.push("Eating "+esc(cin.eating_plan_adherence_1_to_5)+"/5");
    return '<details class="card pad pastwk"'+(i===0?" open":"")+'>'+
      '<summary><span class="eb">'+esc(w.label||("Week "+w.n))+'</span><div style="font-weight:500;margin-top:2px">'+fD(w.start)+' to '+fD(w.end)+'</div><div class="sub">'+esc(line||"No sessions")+'</div></summary>'+
      (w.coachNote?'<div class="coach" style="margin-top:12px"><span class="eb">Coach</span><span>'+esc(w.coachNote)+'</span></div>':'')+
      (bits.length?'<div class="sub" style="margin-top:10px"><b style="color:var(--ink)">Check-in.</b> '+bits.join(" · ")+'</div>':'')+
      (cin.anything_else?'<div class="prose"><p>'+esc(cin.anything_else)+'</p></div>':'')+
      '<div class="acts">'+sessions.map(s=>{const c=pastCat(s.type);return '<div class="act"><span class="chip'+catCls(c)+'">'+esc(CAT_NAME[c]||"Other")+'</span><span class="act-a"><b>'+esc(s.title||s.type||"Session")+'</b><span class="sub">'+esc([s.day,s.date?fD(s.date):"",s.planned_summary,s.done?"Done":"",s.rpe?"RPE "+s.rpe:""].filter(Boolean).join(" · "))+'</span></span></div>';}).join("")+'</div></details>';
  }).join("")+'</div>';
}
function vPlan(){
  const all=weekList(); const ws=visiblePlanWeeks(); const past=UI.showPast?pastSection():"";
  if(!all.length)return head("Plan","The block")+weekGrid(ws)+past+'<div class="card pad"><div class="empty">The plan appears here once loaded.</div></div>';
  const cur=weekOf(melbourneToday()); if(UI.openWeek==null)UI.openWeek=cur?cur.n:(ws[0]?ws[0].n:-1);
  const cats=ws.reduce((o,w)=>{const b=weekBreakdown(w.days||[]);o.gym+=b.planned.gym;o.ball+=b.planned.ball;o.run+=b.planned.runKm;return o;},{gym:0,ball:0,run:0});
  const span=planBounds();
  let h=head("The block · "+span.n+" weeks","Gym, basketball and running",fD(span.start)+" to "+fD(span.end)+". Completed kilometres are laid over the plan.");
  h+=weekGrid(ws);
  h+=past;
  h+='<section class="dk pad"><div class="ch"><div><div class="eb">'+fD(span.start)+' to '+fD(span.end)+' · Week '+(cur?cur.n:0)+' of '+span.n+'</div><h2>Training dose</h2><div class="lede">Days each week · later weeks hatched</div></div><div class="metrics" style="grid-template-columns:repeat(3,auto);margin:0;gap:18px"><div class="m"><div class="k">Gym</div><div class="v">'+cats.gym+'<small>days</small></div></div><div class="m"><div class="k">Basketball</div><div class="v">'+cats.ball+'<small>days</small></div></div><div class="m"><div class="k">Run</div><div class="v">'+km1(cats.run)+'<small>km</small></div></div></div></div>'+doseChart(ws)+'</section>';
  h+='<section class="card pad" style="margin-top:14px">';
  ws.forEach(w=>{const open=UI.openWeek===w.n,p=wPlan(w),a=wAct(w);
    h+='<button class="weekhead'+(cur&&cur.n===w.n?' cur':'')+'" data-week="'+w.n+'" aria-expanded="'+open+'"><span class="w">W'+w.n+'</span><span style="flex:1;min-width:0"><span style="display:block;font-weight:500">'+esc(w.phase)+'</span><span class="sub" style="display:block">'+fD(w.start)+' · '+catLine(w.days||[])+(a?' · '+a.toFixed(0)+' km done':'')+'</span>'+(a&&p?'<span class="minibar" style="display:block"><span style="display:block;height:100%;width:'+Math.min(100,a/p*100)+'%;background:var(--cat-run)"></span></span>':'')+'</span><span class="sub">'+(open?'Hide':'Show')+'</span></button>';
    if(open)h+='<div style="padding:0 0 16px">'+(w.focus?'<div class="coach" style="margin-bottom:10px"><span class="eb">Focus</span><span>'+esc(w.focus)+'</span></div>':'')+'<div class="days">'+w.days.map(x=>dayRow(x)).join("")+'</div></div>';
  });
  h+='</section>';
  return h;
}

function runMovingSec(r){const s=+r.sec||+r.moving_time||+r.movingTime||0;if(s>0)return s;const e=+r.el||+r.elapsed_time||0;return e>0?e:0;}
function loggedRuns(){return Object.values(S.runs).filter(r=>isRun(r)&&+r.km>0).sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.start||"").localeCompare(String(b.start||"")));}
function planDays(pred){const out=[];weekList().forEach(w=>(w.days||[]).forEach(d=>{if(pred(d))out.push(d);}));return out.sort((a,b)=>a.date.localeCompare(b.date));}
function dashScrollMark(date,anchor){return date===anchor?" is-next":"";}
function dashAnchor(dates){const t=melbourneToday();return dates.find(d=>d>=t)||dates[dates.length-1]||"";}
function dashCard(id,eb,title,lede,stats,bars,legend){
  if(!bars)return '<section class="dk pad" id="'+id+'"><div class="eb">'+eb+'</div><h2>'+title+'</h2><div class="lede">'+lede+'</div></section>';
  return '<section class="dk pad" id="'+id+'"><div class="ch"><div><div class="eb">'+eb+'</div><h2>'+title+'</h2><div class="lede">'+lede+'</div></div><div class="metrics" style="grid-template-columns:repeat(3,auto);margin:0;gap:16px">'+stats+'</div></div><div class="rb-scroll">'+bars+'</div>'+legend+'</section>';
}
function statTrio(a,b,c){const m=(k,v,s)=>'<div class="m"><div class="k">'+k+'</div><div class="v">'+v+(s?'<small>'+s+'</small>':'')+'</div></div>';return m(a[0],a[1],a[2])+m(b[0],b[1],b[2])+m(c[0],c[1],c[2]);}
function runsOverview(){
  const runs=loggedRuns();
  const planned=planDays(d=>!!RUN_KINDS[d.kind]&&+d.km>0);
  const doneDates=new Set(runs.map(r=>r.date));
  const items=[];
  runs.forEach(r=>items.push({plan:false,date:r.date,km:+r.km,r}));
  planned.forEach(d=>{if(!doneDates.has(d.date))items.push({plan:true,date:d.date,km:+d.km,title:d.title});});
  items.sort((a,b)=>a.date.localeCompare(b.date));
  const km=runs.reduce((a,r)=>a+(+r.km||0),0);
  const paced=runs.filter(r=>runMovingSec(r)>0);
  const sec=paced.reduce((a,r)=>a+runMovingSec(r),0);
  const pkm=paced.reduce((a,r)=>a+(+r.km||0),0);
  const avg=pkm?sec/pkm:0, kmh=sec?pkm/(sec/3600):0;
  const planKm=planned.reduce((a,d)=>a+(+d.km||0),0);
  if(!items.length)return dashCard("runboard","Every run","Distance and pace","Bars appear here once a run is logged or the plan loads.");
  const max=Math.max(...items.map(it=>it.km),1)*1.18;
  const anchor=dashAnchor(items.map(it=>it.date));
  const bars=items.map(it=>{
    const h=Math.max(18,it.km/max*132);
    if(it.plan)return '<button type="button" class="rb plan'+dashScrollMark(it.date,anchor)+'" data-day="'+it.date+'" aria-label="'+esc("Planned "+(it.title||"run")+" "+fD(it.date)+" "+it.km+" km")+'"><span class="rb-pace"></span><span class="rb-spd"></span><span class="rb-bar plan" style="height:'+h.toFixed(0)+'px"><b>'+it.km.toFixed(1)+'</b></span><span class="rb-date">'+esc(fD(it.date))+'</span></button>';
    const dsec=runMovingSec(it.r), dist=it.km;
    const pace=dsec?fP(dsec/dist):"";
    const spd=dsec?(dist/(dsec/3600)).toFixed(1):"";
    return '<button type="button" class="rb'+dashScrollMark(it.date,anchor)+'" data-day="'+it.date+'" aria-label="'+esc((it.r.title||"Run")+" "+fD(it.date)+(pace?" "+pace+"/km":""))+'"><span class="rb-pace">'+(pace||"")+'</span><span class="rb-spd">'+(spd?spd+" km/h":"")+'</span><span class="rb-bar" style="height:'+h.toFixed(0)+'px"><b>'+dist.toFixed(1)+'</b></span><span class="rb-date">'+esc(fD(it.date))+'</span></button>';
  }).join("");
  const lede="Bar height is kilometres. Pace uses moving time. Planned runs are hatched."+(planKm?" "+(Math.round(planKm*10)/10)+" km on the plan.":"");
  const legend='<div class="legend"><span><i class="rb-swatch"></i>Done</span><span><i class="rb-swatch plan"></i>Planned</span><span>'+(kmh?"Average speed "+kmh.toFixed(1)+" km/h.":"")+'</span></div>';
  return dashCard("runboard","Every run","Distance and pace",lede,statTrio(["Total",km.toFixed(1),"km"],["Runs",runs.length,""],["Avg pace",avg?fP(avg):"—","/km"]),bars,legend);
}
function ballMinutes(r){const s=runMovingSec(r);return s>0?Math.round(s/60):0;}
function ballOverview(){
  const logged=Object.values(S.runs).filter(r=>catOf(r)==="ball").sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.start||"").localeCompare(String(b.start||"")));
  const planned=planDays(d=>gridParts(d).acts.includes("ball"));
  const doneDates=new Set(logged.map(r=>r.date));
  const items=[];
  logged.forEach(r=>items.push({plan:false,date:r.date,min:ballMinutes(r),title:r.title||"Basketball"}));
  planned.forEach(d=>{if(!doneDates.has(d.date))items.push({plan:true,date:d.date,title:d.title||"Basketball"});});
  items.sort((a,b)=>a.date.localeCompare(b.date));
  const mins=logged.reduce((a,r)=>a+ballMinutes(r),0);
  const left=planned.filter(d=>!doneDates.has(d.date)).length;
  if(!items.length)return dashCard("ballboard","Games","Time on court","Bars appear here once a game is logged or the plan loads.");
  const known=items.filter(it=>!it.plan&&it.min>0);
  const max=Math.max(1,...known.map(it=>it.min));
  const anchor=dashAnchor(items.map(it=>it.date));
  const bars=items.map(it=>{
    const h=it.plan||!it.min?44:Math.max(18,it.min/max*132);
    const label=it.plan?"—":(it.min?String(it.min):"—");
    return '<button type="button" class="rb'+(it.plan?" plan":"")+dashScrollMark(it.date,anchor)+'" data-day="'+it.date+'" aria-label="'+esc((it.plan?"Planned ":"")+it.title+" "+fD(it.date)+(it.min?" "+it.min+" min":""))+'"><span class="rb-pace"></span><span class="rb-spd"></span><span class="rb-bar ball'+(it.plan?" plan":"")+'" style="height:'+h.toFixed(0)+'px"><b>'+label+'</b></span><span class="rb-date">'+esc(fD(it.date))+'</span></button>';
  }).join("");
  const legend='<div class="legend"><span><i class="rb-swatch ball"></i>Done</span><span><i class="rb-swatch plan"></i>Planned</span></div>';
  return dashCard("ballboard","Games","Time on court","Bar height is minutes from the logged duration. Planned games have no duration stored, so they are a flat bar.",statTrio(["Done",logged.length,""],["Left",left,""],["Minutes",mins||"—",mins?"min":""]),bars,legend);
}
function gymMeasure(l){
  const st=sessStats(l);
  if(st.t>0)return {metric:"kg",value:st.t,label:Math.round(st.t)>=1000?(st.t/1000).toFixed(1)+"t":String(Math.round(st.t))};
  if(st.sets>0)return {metric:"sets",value:st.sets,label:String(st.sets)};
  if(+l.min>0)return {metric:"min",value:+l.min,label:String(+l.min)};
  return {metric:"flat",value:0,label:"—"};
}
function gymLoggedSessions(){
  const out=lifts().map(l=>{const m=gymMeasure(l);return {date:l.date,title:l.name||"Gym",...m};});
  const have=new Set(out.map(x=>x.date));
  Object.values(S.runs).filter(r=>catOf(r)==="gym"&&!have.has(r.date)).forEach(r=>{
    const min=runMovingSec(r)?Math.round(runMovingSec(r)/60):0;
    out.push({date:r.date,title:r.title||"Gym",metric:min?"min":"flat",value:min,label:min?String(min):"—"});
  });
  Object.values(S.log||{}).forEach(l=>{if(l&&l.gymDone&&l.date&&!out.some(x=>x.date===l.date))out.push({date:l.date,title:"Gym",metric:"flat",value:0,label:"—"});});
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function gymOverview(){
  const logged=gymLoggedSessions();
  const planned=planDays(d=>gridParts(d).acts.includes("gym"));
  const doneDates=new Set(logged.map(x=>x.date));
  const items=[];
  logged.forEach(x=>items.push({plan:false,...x}));
  planned.forEach(d=>{if(!doneDates.has(d.date))items.push({plan:true,date:d.date,title:d.title||"Gym",metric:"flat",value:0,label:"—"});});

function loadRead(all,now,dC){
  const r=[];
  if(dC>8)r.push("Fitness is climbing more than 8 a week. That's aggressive; hold here for a week.");
  else if(dC>3)r.push("Fitness is building steadily. Good rate.");
  else if(dC<-3)r.push("Fitness is drifting down. Expected in a recovery or injury block, not in a build.");
  if(now.tsb<-30)r.push("Form is below minus 30. Injury and illness risk is high; take an easy day.");
  else if(now.tsb<-10)r.push("Form in the minus 10 to minus 30 band is where fitness gets built.");
  else if(now.tsb>5&&now.tsb<25)r.push("You're fresh. This is where you race well.");
  const race=goalRace();
  r.push(race?"The running goal is 10 km at 5:45/km on "+fD(race.date,true)+".":"Keep easy days easy and log the gym weights.");
  return r.join(" ");
}

async function sendChat(text){
  if(!text)return; if(!S.db){toast("Chat is unavailable right now");return;}
  const ts=new Date(); const stamp=iso(ts)+"T"+p2(ts.getHours())+":"+p2(ts.getMinutes())+":"+p2(ts.getSeconds());
  const id=stamp.replace(/[^0-9]/g,"")+"-u";
  const st=$("#chatState"); const inp=$("#chatIn"); if(inp)inp.value="";
  try{await S.db.collection("chat").doc(id).set({ts:stamp,role:"user",text,via:"dashboard",handled:false});}catch(e){toast("Couldn't send. Try again.");return;}
  const sample=async(turns)=>{const {data,error}=await SB.functions.invoke("coach",{body:{turns}});if(error){let code="error";try{const b=await error.context.json();code=b.code||code;}catch(_){}throw {code};}return {text:data.text};};
  if(st)st.textContent="Coach is thinking";
  const turns=S.chat.slice(-12).map(m=>({role:m.role==="user"?"user":"assistant",content:m.text}));
  if(!turns.length||turns[turns.length-1].content!==text)turns.push({role:"user",content:text});
  while(turns.length&&turns[0].role!=="user")turns.shift();
  const brief="You are Daniel's coach (running, gym, basketball, soccer and anything else he does), texting him like a good human coach would: direct, warm, specific, Australian English, short (2 to 6 sentences unless he asks for detail). Never use em dashes or en dashes. Ground every answer in the data below and in sports science. Be conservative with injury: never clear him to run on the foot; send red flags (heat, spreading redness, fever, cannot bear weight) to same-day medical care. If his message implies a plan change (missed sessions, illness, niggle, travel, schedule), say what you would change and end with a line starting PLAN CHANGE: summarising it, so it can be built into the plan. Ask at most one question.\n\n"+coachContext()+"\n\nConversation follows. Reply to his latest message.";
  turns[0]={role:"user",content:brief+"\n\nDaniel: "+turns[0].content};
  try{const {text:reply}=await sample(turns,{cache:false});
    const t2=new Date(); const s2=iso(t2)+"T"+p2(t2.getHours())+":"+p2(t2.getMinutes())+":"+p2(t2.getSeconds());
    await S.db.collection("chat").doc(s2.replace(/[^0-9]/g,"")+"-c").set({ts:s2,role:"coach",text:reply,via:"dashboard",planChange:/PLAN CHANGE:/i.test(reply),handled:!/PLAN CHANGE:/i.test(reply)});
    if(st)st.textContent="";
  }catch(e){if(st)st.textContent=e&&e.code==="no_key"?"Coach needs the API key added in Supabase. Your message is saved.":"No reply this time. Your message is saved for the next sync.";}
}

function parseCSV(t){const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else if(c==='"')q=true;else if(c===','){row.push(f);f="";}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f="";}else f+=c;}if(f||row.length){row.push(f);rows.push(row);}return rows.filter(r=>r.some(x=>x.trim()));}
const lp=dt=>({date:iso(dt),start:iso(dt)+"T"+p2(dt.getHours())+p2(dt.getMinutes())});
const sportOf=t=>/run/i.test(t||"run")?"run":"other";

  const iT=c("activity type"),iD=c("date","activity date"),iN=c("title","activity name"),iDi=c("distance"),iTi=c("moving time","time","elapsed time"),iH=c("avg hr","average heart rate"),iMx=c("max hr","max heart rate"),iCa=c("avg run cadence","average cadence"),iAs=c("total ascent","elevation gain"),iPa=c("avg pace");

    const dt=/^\d{4}-\d{2}-\d{2}/.test(ds)?new Date(ds.replace(" ","T")):new Date(ds+(strava?" UTC":""));if(isNaN(dt))continue;
    const sport=sportOf(type);let km=num(r[iDi]);if(km>500)km/=1000;if(!(km>0))km=0;

function fromGPX(text){const x=new DOMParser().parseFromString(text,"application/xml");const pts=[...x.getElementsByTagName("trkpt")];if(pts.length<2)return[];
  const R=6371000,rad=d=>d*Math.PI/180;let m=0,hr=[];const P=pts.map(p=>{const t=p.getElementsByTagName("time")[0];const h=[...p.getElementsByTagName("*")].find(e=>e.localName==="hr");if(h)hr.push(+h.textContent);return{la:+p.getAttribute("lat"),lo:+p.getAttribute("lon"),t:t?new Date(t.textContent):null};});

/* ===================== Session check + pace review ===================== */
function targetsFor(d,v){
  if(!hasVdot())return null;
  v=v||+S.settings.vdot; const L=+S.settings.lthr||167;
  const eF=paceF(.70,v), eS=paceF(.62,v), T=paceF(.88,v), I=paceF(.98,v), R=paceF(1.07,v);
  const det=d&&d.detail||"", k=d&&d.kind;
  if(!d||!(+d.km)||["rest","cross","strength"].includes(k))return null;
  if(k==="race")return {type:"race"};
  if(k==="threshold")return {type:"work",name:"Tempo",pace:T,tol:.02,hr:[L*.93,L*1.0],ez:[eF,eS],cap:L*.89};
  if(k==="quality"&&/\{R\}/.test(det))return {type:"work",name:"Strides",pace:R,tol:.03,hr:null,ez:[eF,eS],cap:L*.89};
  if(k==="quality")return {type:"work",name:"Reps",pace:I,tol:.025,hr:[L*.97,L*1.06],ez:[eF,eS],cap:L*.89};
  if(k==="recovery")return {type:"easy",name:"Recovery",band:[eS,eS*1.12],cap:L*.81,soft:L*.85};
  return {type:"easy",name:k==="long"?"Long easy":"Easy",band:[eF,eS],cap:L*.89,soft:L*.91,long:k==="long"};
}
function lapsOf(r){return (r.laps||[]).map(l=>({m:+l[0],s:+l[1],hr:+l[2]||0,el:+l[3]||+l[1]})).filter(l=>l.m>=300&&l.s>0);}
function fMS(sec){sec=Math.round(sec);return Math.floor(sec/60)+':'+p2(sec%60);}
function wavg(arr,val,w){const tw=arr.reduce((a,x)=>a+w(x),0);return tw?arr.reduce((a,x)=>a+val(x)*w(x),0)/tw:0;}
function decoupling(laps){if(laps.length<6)return null;const h=Math.floor(laps.length/2),a=laps.slice(0,h),b=laps.slice(-h);
  const ef=x=>{const p=wavg(x,l=>l.s/l.m*1000,l=>l.m),hr=wavg(x,l=>l.hr,l=>l.s);return hr?(1000/p)/hr:0;};const e1=ef(a),e2=ef(b);return e1&&e2?(e1-e2)/e1*100:null;}
function analyseRun(r,d){
  const t=targetsFor(d); if(!t||t.type==="race"||!isRun(r)||!(+r.km))return null;
  const L=+S.settings.lthr||167, el=Math.max(+r.el||0,+r.sec||0), stop=Math.max(0,el-(+r.sec||0)), key=!!(t.long||t.type==="work"), hr=+r.avgHr||0, laps=lapsOf(r);
  const pace=(key&&t.long?el:r.sec)/r.km;
  const out={t,pace,hr,score:0,tone:"",head:"",why:"",reps:null,dec:decoupling(laps),stop,el,key};
  const stopNote=()=>{if(!key||stop<30)return;const pct=stop/el*100;out.score-=pct>2?1:.5;if(out.tone==="good"||!out.tone)out.tone="warn";
    out.why+=" Watch stopped for "+fMS(stop)+" ("+pct.toFixed(1)+"% of the session). Long runs and key sessions are judged on elapsed time: the clock keeps running, so do you. Walk if you must, but don't stop the watch.";};
  if(t.type==="easy"){
    const fastBy=(t.band[0]-pace)/t.band[0];
    if(hr&&hr>t.soft&&fastBy>0.02){out.score=-1;out.tone="warn";out.head="Ran it too hard";out.why="Faster than easy pace and heart rate over "+Math.round(t.cap)+". Easy days only work if they stay easy.";}
    else if(hr&&hr>t.soft){out.score=-1;out.tone="warn";out.head="Heart rate high for the pace";out.why="Average "+Math.round(hr)+" bpm at "+fP(pace)+"/km, above the "+Math.round(t.cap)+" easy cap. Heat, hills, poor sleep or fatigue. One run means little; two or three in a row means back off.";}
    else if(hr&&fastBy>0.03&&hr<=t.cap){out.score=1;out.tone="good";out.head="Quick and controlled";out.why=fP(pace)+"/km at "+Math.round(hr)+" bpm, quicker than the easy band while staying under the cap. A sign fitness is ahead of your paces.";}
    else if(hr&&hr<=t.cap){out.score=.5;out.tone="good";out.head="Spot on";out.why=fP(pace)+"/km at "+Math.round(hr)+" bpm. Easy pace, easy heart rate.";}
    else if(hr){out.score=0;out.tone="warn";out.head="Top end of easy";out.why=fP(pace)+"/km at "+Math.round(hr)+" bpm, right on the "+Math.round(t.cap)+" easy cap. Fine once, but easy days should sit a few beats lower.";}
    else if(fastBy>0.03){out.tone="warn";out.head="Quicker than easy";out.why="No heart rate, and the pace was faster than the easy band.";}
    else {out.tone="";out.head="Logged";out.why=fP(pace)+"/km. Wear the strap or watch HR so the check can read effort.";}
    if(t.long&&out.dec!=null&&out.dec>5){out.score=Math.min(out.score,0);out.why+=" Heart rate drifted "+out.dec.toFixed(1)+"% in the second half, so the long run endurance needs work. Fuel earlier and keep the first half honest.";}
    else if(t.long&&out.dec!=null&&out.dec<3&&out.score>0){out.why+=" Only "+out.dec.toFixed(1)+"% drift second half: strong aerobic durability.";}
    if(!t.long&&out.dec!=null&&out.dec>6){out.score=Math.min(out.score,0);if(out.tone==="good")out.tone="warn";out.head=(out.head==="Spot on"||out.head==="Top end of easy")?"Heart rate crept up":out.head;out.why+=" Heart rate crept "+out.dec.toFixed(1)+"% from the first half to the second at the same pace. Common in the first weeks back (blood volume drops after time off), in warm afternoons, or when tired. If it repeats, slow the second half down rather than chase the pace.";}
    if(!key&&stop>=180)out.why+=" Watch stopped "+fMS(stop)+" in total.";
    stopNote();
    return out;}
  // work sessions: find the work laps
  let work=laps.filter(l=>l.s/l.m*1000<=t.pace*(1+Math.max(.06,t.tol*2.5)));
  if(work.length<2&&laps.length>=4){const sorted=laps.slice().sort((a,b)=>a.s/a.m-b.s/b.m);work=sorted.slice(0,Math.max(2,Math.round(laps.length*.4)));}
  if(!work.length){out.head="Logged";out.why="Average "+fP(pace)+"/km. Press lap on your watch at the start and end of each rep so each one can be checked.";return out;}
  const wp=wavg(work,l=>l.s/l.m*1000,l=>l.m), wh=wavg(work,l=>l.hr,l=>l.s);
  out.reps={n:work.length,pace:wp,hr:wh,list:work};
  const diff=(t.pace-wp)/t.pace; // + = faster
  const hrHigh=t.hr&&wh&&wh>t.hr[1], hrLow=t.hr&&wh&&wh<t.hr[0];
  const tgt=fP(t.pace)+"/km";
  if(diff>t.tol&&!hrHigh){out.score=2;out.tone="good";out.head="Ahead of target";out.why="Work averaged "+fP(wp)+"/km against "+tgt+(wh?" at "+Math.round(wh)+" bpm":"")+". Faster without the heart rate blowing out: your paces can move up.";}
  else if(Math.abs(diff)<=t.tol&&!hrHigh){out.score=hrLow?1.5:1;out.tone="good";out.head=hrLow?"On target, easier than expected":"On target";out.why="Work averaged "+fP(wp)+"/km against "+tgt+(wh?" at "+Math.round(wh)+" bpm":"")+(hrLow?". Heart rate under the band, so there is more in the tank.":". Exactly what the session asked for.");}
  else if(diff>=-t.tol&&hrHigh){out.score=-1;out.tone="warn";out.head="Hit pace, working too hard";out.why="Pace was there ("+fP(wp)+"/km) but heart rate averaged "+Math.round(wh)+", above "+Math.round(t.hr[1])+". Either fatigue or the target is a touch fast. Don't chase it next time.";}
  else {out.score=-1.5;out.tone="bad";out.head="Short of target";out.why="Work averaged "+fP(wp)+"/km against "+tgt+(wh?" at "+Math.round(wh)+" bpm":"")+". Check sleep, fuel and heat before blaming fitness.";}
  if(t.long&&out.dec!=null&&out.dec>5)out.why+=" Drift "+out.dec.toFixed(1)+"% second half.";
  stopNote();

  const A=weekDocOf(src),B=weekDocOf(dst); if(!A||!B){toast("Couldn't find that week.");return false;}

  const da=wa.days[A.i], db=wb.days[B.i]; const tmp={}; F.forEach(k=>{tmp[k]=da[k];});

  [wa,wb].forEach(w=>{w.target=(w.days||[]).reduce((a,d)=>a+(+d.km||0),0);});

function liftAgg(from,to){const ls=lifts().filter(l=>l.date>=from&&l.date<=to);const mus={},mt={};let t=0,sets=0,reps=0;

function gymPeriod(p){if(p==="month")return [addD(TODAY,-27),TODAY];if(p==="year")return [TODAY.slice(0,5)+"01-01",TODAY];return [monOf(TODAY),addD(monOf(TODAY),6)];}

function parseQuick(txt){ // "squat 3x5 100, rdl 3x8@60; plank 3x40s"

    let m=s.match(/(\d+)\s*[x×]\s*(\d+)\s*(s|sec)?/i); const sets=m?+m[1]:1, reps=m?+m[2]:+((s.match(/\b(\d+)\s*reps?\b/i)||[])[1]||8);
    let rest=m?s.replace(m[0]," "):s; const wm=rest.match(/@?\s*(\d+(?:\.\d+)?)\s*(kg)?/i); const w=wm?+wm[1]:0; if(wm)rest=rest.replace(wm[0]," ");
    const q=rest.toLowerCase().replace(/[^a-z ]/g," ").trim(); if(!q)return null;
    let best=null,bs=0; EX.forEach(e=>{let sc=0;q.split(/\s+/).forEach(t=>{if(t.length<2)return;if(e.k.includes(t))sc+=t.length;});if(e.k.startsWith(q))sc+=5;if(sc>bs){bs=sc;best=e;}});

    $("#lgDiscard").onclick=e=>{const b=e.currentTarget;if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent=L.id?"Tap again to drop changes":"Tap again to discard";setTimeout(()=>{if(b.isConnected){b.dataset.c="";b.textContent=L.id?"Discard changes":"Discard session";}},3000);return;}
      clearDraft();clearInterval(UI.gymClk);closeSheet();toast(L.id?"Changes dropped":"Session discarded");render();};
    $("#lgNote").oninput=e=>{L.note=e.target.value;keep();};
    document.querySelectorAll("#sheetRoot [data-in]").forEach(inp=>inp.onchange=()=>{const [i,j,k]=inp.dataset.in.split(",");L.ex[+i].sets[+j][k]=+inp.value||0;keep();draw();});
    document.querySelectorAll("#sheetRoot [data-st]").forEach(b=>b.onclick=()=>{const [i,j,k,d]=b.dataset.st.split(",");const st=L.ex[+i].sets[+j];st[k]=Math.max(0,Math.round(((+st[k]||0)+(+d))*10)/10);keep();draw();});
    document.querySelectorAll("#sheetRoot [data-tick]").forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.tick.split(",").map(Number);const st=L.ex[i].sets[j];st.done=!st.done;
      if(st.done){const nx=L.ex[i].sets[j+1];if(nx&&!nx.done&&!(+nx.w)&&+st.w)nx.w=st.w; const e=EXI[L.ex[i].id]; keep();draw();rest(e&&(e.t==="p"||e.t==="t")?45:(e&&LOWER.some(m=>e.p.includes(m))&&e.t==="w"&&(+st.w>=60)?150:90));}else{keep();draw();}});
    document.querySelectorAll("#sheetRoot [data-addset]").forEach(b=>b.onclick=()=>{const xx=L.ex[+b.dataset.addset];const ls=xx.sets[xx.sets.length-1]||{w:0,r:8};xx.sets.push({w:ls.w,r:ls.r,done:false});keep();draw();});
    document.querySelectorAll("#sheetRoot [data-tickall]").forEach(b=>b.onclick=()=>{const xx=L.ex[+b.dataset.tickall];const v=!xx.sets.every(st=>st.done);xx.sets.forEach(st=>st.done=v);keep();draw();});
    document.querySelectorAll("#sheetRoot [data-rmex]").forEach(b=>b.onclick=()=>{L.ex.splice(+b.dataset.rmex,1);swapI=-1;keep();draw();});
    document.querySelectorAll("#sheetRoot [data-swap]").forEach(b=>b.onclick=()=>{const i=+b.dataset.swap;swapI=swapI===i?-1:i;draw();if(swapI>=0){const q=$("#lgSq");q&&q.focus({preventScroll:true});}});
    if(swapI>=0&&$("#lgSw")){const xx=L.ex[swapI], cur=EXI[xx.id]||{p:[],t:"w",name:xx.id};
      const sc=e=>(e.p[0]===cur.p[0]?2:0)+(e.p.length===cur.p.length?1:0);const sim=EX.filter(e=>e.id!==xx.id&&e.t===cur.t&&e.p.some(m=>cur.p.includes(m))).sort((x,y)=>sc(y)-sc(x));
      const list=q=>{q=(q||"").toLowerCase().trim();const items=(q?EX.filter(e=>e.id!==xx.id&&(e.k.includes(q)||e.p.some(m=>m.startsWith(q)))):sim).slice(0,12);
        return items.map(e=>'<button type="button" data-to="'+e.id+'"><b>'+esc(e.name)+'</b><span>'+e.p.map(m=>MUSC[m]).join(", ")+'</span></button>').join("")+
          (q&&!EX.some(e=>e.name.toLowerCase()===q)?'<button type="button" data-to="__custom"><b>Use “'+esc($("#lgSq").value.trim())+'”</b><span>New exercise, counts to '+(cur.p.map(m=>MUSC[m]).join(", ")||"no muscle group")+'</span></button>':'');};
      const doSwap=to=>{let id=to;if(to==="__custom"){const nm=$("#lgSq").value.trim();if(!nm)return;id="c-"+nm.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
          const ex=EX.find(e=>e.id===id);if(!ex){xx.cdef={name:nm,t:cur.t,p:cur.p.slice(),s:(cur.s||[]).slice(),bw:cur.bw||0};regEx({id,cdef:xx.cdef});}}
        const prevName=cur.name;const anyDone=xx.sets.some(st=>st.done);
        if(!anyDone){const f=exFromLast(id,xx.sets.length,(xx.sets[0]&&xx.sets[0].r)||8);xx.sets=f.sets;}
        xx.id=id;if(id.startsWith("c-")){const e=EXI[id];xx.cdef={name:e.name,t:e.t,p:e.p,s:e.s,bw:e.bw};}else delete xx.cdef;
        swapI=-1;keep();draw();toast(prevName+" → "+EXI[id].name);};
      const bs=()=>document.querySelectorAll("#lgSl [data-to]").forEach(b=>b.onclick=()=>doSwap(b.dataset.to));
      $("#lgSl").innerHTML=list("");bs();$("#lgSq").oninput=e=>{$("#lgSl").innerHTML=list(e.target.value);bs();};
      $("#lgSq").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const f=document.querySelector("#lgSl [data-to]");f&&f.click();}};}
    $("#lgQ").onsubmit=e=>{e.preventDefault();const add=parseQuick($("#lgQi").value);if(!add.length){toast("Couldn't match that. Try: squat 3x5 100");return;}add.forEach(a=>{const ex=L.ex.find(x=>x.id===a.id&&!x.sets.some(s=>s.done));if(ex)ex.sets=a.sets;else L.ex.push(a);});keep();draw();toast("Added "+add.map(a=>EXI[a.id].name).join(", "));};
    $("#lgPick").onclick=()=>{const p=$("#lgPicker");const recent=[...new Set(lifts().slice().reverse().flatMap(l=>(l.ex||[]).map(x=>x.id)))].slice(0,8);
      const list=q=>{q=(q||"").toLowerCase().trim();const items=q?EX.filter(e=>e.k.includes(q)||e.p.some(m=>m.startsWith(q))):recent.map(id=>EXI[id]).filter(Boolean).concat(EX.filter(e=>!recent.includes(e.id)));
        return items.slice(0,40).map(e=>'<button type="button" data-pick="'+e.id+'"><b>'+esc(e.name)+'</b><span>'+e.p.map(m=>MUSC[m]).join(", ")+'</span></button>').join("");};
      p.innerHTML='<input id="lgPq" placeholder="Search exercise or muscle" autocomplete="off"><div class="pick" id="lgPl">'+list("")+'</div>';
      const bp=()=>p.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{L.ex.push(exFromLast(b.dataset.pick,3,8));keep();draw();setTimeout(()=>{const s=document.querySelector(".sheet.lg");s&&s.scrollTo({top:s.scrollHeight,behavior:"smooth"});},30);});
      bp(); const q=$("#lgPq"); q.focus(); q.oninput=()=>{$("#lgPl").innerHTML=list(q.value);bp();};};
    $("#lgFin").onclick=async()=>{const ex=L.ex.map(x=>({id:x.id,...(x.cdef?{cdef:x.cdef}:{}),sets:x.sets.filter(s=>s.done).map(s=>({w:+s.w||0,r:+s.r||0}))})).filter(x=>x.sets.length);
      if(!ex.length){toast("Tick at least one set first");return;}
      if(!S.db){toast("Saving is unavailable right now");return;}
      const id=L.id||(L.date+"-"+String(L.start||"0000").replace(":",""));
      const mins=L.minSet?+L.min:(L.t0&&!L.id?Math.max(1,Math.round((Date.now()-L.t0)/60000)):(L.min||0));
      const doc={date:L.date,start:L.start||"",name:(L.name||"Gym session").trim(),tpl:L.tpl||"",ex,note:(L.note||"").trim(),bw:+L.bw||bw,min:mins>0&&mins<300?mins:(L.min||0),updated:new Date().toISOString()};
      const b=$("#lgFin");b.disabled=true;b.textContent="Saving";
      try{await S.db.collection("lifts").doc(id).set(doc);
        const lg={...(S.log[L.date]||{}),date:L.date,gymDone:true};await S.db.doc("log/"+L.date).set(lg);
        clearDraft();clearInterval(UI.gymClk);toast("Saved · "+fT(sessStats(doc).t)+" lifted");closeSheet();UI.tab="gym";render();setTimeout(()=>openLift(id),50);}
      catch(err){toast("Couldn't save. Your session is kept on this phone, try again.");b.disabled=false;b.textContent="Finish";}};
  }
  keep(); draw();
}
function gymCtx(){const a=liftAgg(addD(TODAY,-27),TODAY);if(!a.n)return "GYM: none logged in the last 4 weeks";const top=Object.keys(a.mus).sort((x,y)=>a.mus[y]-a.mus[x]).slice(0,4).map(k=>MUSC[k]+" "+a.mus[k].toFixed(1)).join(", ");
  return "GYM last 4 weeks: "+a.n+" sessions, "+fT(a.t)+" lifted, "+a.sets+" sets. Top muscles by sets: "+top+". Last session "+lifts().slice(-1)[0].date+" "+(lifts().slice(-1)[0].name||"");}

function render(){
  const y=scrollY; const v={today:vToday,plan:vPlan,gym:vGym,ball:vBall,run:vRuns,runs:vRuns,meals:vMeals,coach:vCoach,fitness:vFitness}[UI.tab]||vToday;
  $("#app").innerHTML=v();
  if(S.db)passwordPrompt();

  RACE_DATE=gs.goalDate||(race&&race.date)||"2099-01-01";
  if(gs.goalDate){$("#raceChip").style.display="";$("#raceChip").innerHTML=esc(gs.goalShort||"Goal")+' <b>'+Math.max(0,dBetween(TODAY,gs.goalDate))+'d</b>';}
  else if(race){$("#raceChip").style.display="";$("#raceChip").innerHTML='10 km <b>'+Math.max(0,dBetween(TODAY,race.date))+'d</b>';}
  else $("#raceChip").style.display="none";

}
function setTab(t){UI.tab=t;UI.sel=null;try{localStorage.setItem("dt-tab",t);}catch(e){}closeSheet();render();scrollTo(0,0);}
document.addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b&&b.tagName==="BUTTON"){setTab(b.dataset.tab);}});
function bind(r){
  bindSetup(r);

  r.querySelectorAll("[data-showpast]").forEach(b=>b.onclick=()=>{UI.showPast=!UI.showPast;render();});

  r.querySelectorAll("[data-loadmode]").forEach(b=>b.onclick=()=>{UI.loadMode=b.dataset.loadmode;render();});

let rq=0,pend=false;const typing=()=>{const a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));};
function sched(){cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>{if(typing()||$("#scrim")){pend=true;return;}pend=false;render();});}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pend&&!typing()&&!$("#scrim"))sched();},60));
new MutationObserver(()=>{if(pend&&!$("#scrim"))sched();}).observe($("#sheetRoot"),{childList:true});
render();
function startData(){
  if(S.db)return; hideSignin();
  const db=makeDb(SB); S.db=db;
  db.collection("weeks").onSnapshot(s=>{S.weeks={};s.docs.forEach(d=>{if(d.exists)S.weeks[d.id]=d.data();});S.loaded=true;sched();},()=>{S.loaded=true;sched();});
  db.collection("pastweeks").onSnapshot(s=>{S.pastweeks={};s.docs.forEach(d=>{if(d.exists)S.pastweeks[d.id]=d.data();});sched();},()=>{});
  db.collection("runs").onSnapshot(s=>{S.runs={};s.docs.forEach(d=>{if(d.exists)S.runs[d.id]=d.data();});sched();},()=>{});
  db.collection("lifts").onSnapshot(s=>{S.lifts={};s.docs.forEach(d=>{if(d.exists)S.lifts[d.id]=d.data();});sched();},()=>{});
  db.collection("log").onSnapshot(s=>{S.log={};s.docs.forEach(d=>{if(d.exists)S.log[d.id]=d.data();});sched();},()=>{});
  db.collection("notes").onSnapshot(s=>{S.notes=s.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));sched();},()=>{});
  db.collection("chat").onSnapshot(s=>{S.chat=s.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.ts||"").localeCompare(String(b.ts||"")));sched();},()=>{});
  db.collection("weights").onSnapshot(s=>{S.weights={};s.docs.forEach(d=>{if(d.exists)S.weights[d.id]=d.data();});sched();},()=>{});
  db.collection("adjust").onSnapshot(s=>{S.adjust={};s.docs.forEach(d=>{if(d.exists)S.adjust[d.id]=d.data();});sched();},()=>{});
  db.doc("settings/main").onSnapshot(d=>{if(d.exists)S.settings=d.data()||{};sched();},()=>{});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")db.refresh();});
}
(async function boot(){
  bindSignin();
  SB.auth.onAuthStateChange((ev,session)=>{ if(session&&!S.db) setTimeout(startData,0); if(ev==="SIGNED_OUT"){ location.replace(location.origin+location.pathname); } });
  const sess=(await SB.auth.getSession()).data.session;
  if(sess) startData(); else if(!S.db) showSignin();
})();
})();
